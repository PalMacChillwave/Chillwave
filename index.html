<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chillwave - Focus & Study Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />

    <style>
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-rounded.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2); border-radius: 20px; }

        .spin-slow { animation: spin 20s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @keyframes bounce-eq {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .eq-bar { animation: bounce-eq 1s ease-in-out infinite; }
        .eq-bar:nth-child(1) { animation-delay: 0ms; }
        .eq-bar:nth-child(2) { animation-delay: 150ms; }
        .eq-bar:nth-child(3) { animation-delay: 300ms; }

        /* Zen Mode Transitions */
        .ui-panel {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .zen-active .ui-panel {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }
        .zen-active .bottom-player {
            background: transparent !important;
            border: none !important;
            backdrop-filter: none !important;
        }
    </style>
</head>
<body class="relative w-full h-screen overflow-hidden font-sans text-white bg-gray-900 select-none">

    <!-- Backgrounds -->
    <video id="bg-video" class="absolute inset-0 z-0 w-full h-full object-cover transition-opacity duration-1000 opacity-0" autoplay loop muted playsinline></video>
    <div id="bg-image" class="absolute inset-0 z-0 transition-opacity duration-1000 ease-in-out bg-center bg-cover"></div>
    <div id="bg-gradient" class="absolute inset-0 z-0 opacity-80 mix-blend-multiply transition-all duration-1000"></div>
    <div class="absolute inset-0 z-0 bg-black/20"></div>

    <!-- Main Audio -->
    <audio id="audio-player"></audio>
    
    <!-- Ambient SFX Audio (Now using your already-uploaded GitHub files!) -->
    <audio id="sfx-rain" loop src="./atmosphere/atmos-9.mp3"></audio>
    <audio id="sfx-fire" loop src="./atmosphere/atmos-6.mp3"></audio>
    <audio id="sfx-cafe" loop src="./atmosphere/atmos-2.mp3"></audio>

    <div class="relative z-10 flex flex-col h-full">
        
        <!-- Header -->
        <header class="flex items-center justify-between px-6 py-4">
            <div class="flex items-center gap-3">
                <div class="flex items-center justify-center w-10 h-10 rounded-full bg-white/10 backdrop-blur-md">
                    <span class="material-symbols-rounded">radio</span>
                </div>
                <h1 class="text-xl font-bold tracking-wider text-white drop-shadow-md">
                    CHILL<span class="font-light text-white/70">WAVE</span>
                </h1>
            </div>
            
            <!-- NEW: Pomodoro Timer -->
            <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-4 bg-black/40 backdrop-blur-md px-6 py-2 rounded-full border border-white/10 shadow-lg">
                <button onclick="changeTimerMode('work')" id="btn-work" class="text-xs font-semibold uppercase tracking-wider text-indigo-300 transition-colors">Focus</button>
                <div class="w-px h-4 bg-white/20"></div>
                <button onclick="changeTimerMode('break')" id="btn-break" class="text-xs font-semibold uppercase tracking-wider text-white/50 hover:text-white transition-colors">Break</button>
                <div class="flex items-center gap-2 ml-2">
                    <span id="timer-display" class="font-mono font-bold text-xl tracking-widest w-16 text-center">25:00</span>
                    <button onclick="toggleTimer()" class="hover:text-indigo-400 hover:scale-110 transition-all">
                        <span id="timer-icon" class="material-symbols-rounded fill" style="font-size: 28px;">play_circle</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <!-- Suggest Song Button -->
                <button onclick="toggleSuggestionBox()" class="p-2 transition-colors rounded-full bg-white/10 hover:bg-white/20 text-white border border-white/10 backdrop-blur-md flex items-center gap-2 px-4 ui-panel" title="Suggest a song">
                    <span class="material-symbols-rounded" style="font-size: 18px;">lightbulb</span>
                    <span class="text-sm font-medium hidden sm:block">Suggest</span>
                </button>

                <!-- NEW: Zen Mode Toggle -->
                <button onclick="toggleZenMode()" class="p-2 transition-colors rounded-full bg-white/10 hover:bg-white/20 text-white border border-white/10 backdrop-blur-md flex items-center gap-2 px-4" title="Zen Mode">
                    <span id="zen-icon" class="material-symbols-rounded" style="font-size: 18px;">visibility</span>
                    <span class="text-sm font-medium hidden sm:block">Zen Mode</span>
                </button>
                
                <button onclick="toggleFullscreen()" class="p-2 transition-colors rounded-full hover:bg-white/10 text-white/80 hover:text-white ui-panel" title="Fullscreen">
                    <span class="material-symbols-rounded">fullscreen</span>
                </button>
            </div>
        </header>

        <!-- Center Content Area -->
        <div class="flex flex-1 overflow-hidden">
            
            <!-- Left Sidebar -->
            <div class="flex flex-col gap-2 p-6 w-72 ui-panel">
                <h2 class="mb-2 text-xs font-semibold tracking-widest uppercase text-white/50">Stations</h2>
                <div id="stations-container" class="flex flex-col gap-2"></div>

                <!-- NEW: Ambient Mixer -->
                <h2 class="mt-8 mb-4 text-xs font-semibold tracking-widest uppercase text-white/50 flex items-center gap-2">
                    <span class="material-symbols-rounded" style="font-size: 16px;">tune</span> Ambient Mixer
                </h2>
                <div class="flex flex-col gap-4 bg-black/20 p-4 rounded-xl border border-white/5 backdrop-blur-md">
                    <!-- Rain Slider -->
                    <div class="flex items-center gap-3 group">
                        <span class="material-symbols-rounded text-white/50 group-hover:text-blue-300 transition-colors" style="font-size: 20px;">water_drop</span>
                        <div class="flex-1 h-1.5 bg-white/10 rounded-full cursor-pointer relative flex items-center">
                            <input type="range" min="0" max="1" step="0.01" value="0" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" oninput="changeSfxVolume('rain', this.value)" />
                            <div id="bar-rain" class="h-full bg-blue-400 rounded-full pointer-events-none transition-all" style="width: 0%"></div>
                        </div>
                    </div>

                    </div>

                        <div class="flex-1 h-1.5 bg-white/10 rounded-full cursor-pointer relative flex items-center">
                            <input type="range" min="0" max="1" step="0.01" value="0" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" oninput="changeSfxVolume('cafe', this.value)" />
                            <div id="bar-cafe" class="h-full bg-amber-200 rounded-full pointer-events-none transition-all" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1"></div>

            <!-- Right Sidebar (Playlist) -->
            <div id="playlist-container" class="flex flex-col w-80 p-6 bg-black/20 backdrop-blur-xl border-l border-white/10 h-full transition-transform duration-300 translate-x-0 ui-panel">
                 <h2 class="mb-4 text-xs font-semibold tracking-widest uppercase text-white/50 flex items-center gap-2">
                     <span class="material-symbols-rounded" style="font-size: 18px;">queue_music</span> Up Next
                 </h2>

            </div>
        </div>

        <!-- Bottom Player -->
        <div class="bottom-player relative shrink-0 w-full h-24 bg-black/40 backdrop-blur-2xl border-t border-white/10 flex items-center justify-between px-8 z-20 transition-all duration-500">
            
            <div class="flex items-center gap-4 w-1/4 min-w-[200px]">
                <div id="current-cover-container" class="relative w-14 h-14 overflow-hidden rounded-lg shadow-lg">
                     <img id="current-cover" src="" alt="Cover" class="object-cover w-full h-full" />
                     <div class="absolute inset-0 m-auto w-3 h-3 bg-black/80 rounded-full border border-white/20"></div>
                </div>
                <div class="flex flex-col">
                    <span id="current-title" class="text-sm font-semibold text-white truncate"></span>
                    <span id="current-artist" class="text-xs text-white/60 truncate"></span>
                </div>
            </div>

            <div class="flex flex-col items-center justify-center flex-1 max-w-2xl px-8 gap-2">
                <div class="flex items-center gap-6">
                    <button onclick="playPrev(true)" class="text-white/60 hover:text-white transition-colors">
                        <span class="material-symbols-rounded fill">skip_previous</span>
                    </button>
                    
                    <button onclick="togglePlay()" class="flex items-center justify-center w-12 h-12 rounded-full bg-white text-black hover:scale-105 transition-transform shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                        <span id="main-play-icon" class="material-symbols-rounded fill">play_arrow</span>
                    </button>
                    
                    <button onclick="playNext(true)" class="text-white/60 hover:text-white transition-colors">
                        <span class="material-symbols-rounded fill">skip_next</span>
                    </button>
                </div>

                <div class="flex items-center w-full gap-3 text-xs text-white/50 font-medium">
                    <span id="time-current">0:00</span>
                    <div id="progress-container" class="relative flex-1 h-1.5 bg-white/20 rounded-full cursor-pointer group" onclick="seekTrack(event)">
                        <div id="progress-bar" class="absolute top-0 left-0 h-full bg-white rounded-full transition-all duration-75 group-hover:bg-indigo-400" style="width: 0%">
                            <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        </div>
                    </div>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="flex items-center justify-end gap-6 w-1/4 min-w-[200px] ui-panel">
                <div class="flex items-center gap-2 group">
                    <button onclick="toggleMute()" class="text-white/60 hover:text-white transition-colors">
                        <span id="volume-icon" class="material-symbols-rounded">volume_up</span>
                    </button>
                    <div class="w-24 h-1.5 bg-white/20 rounded-full cursor-pointer relative flex items-center">
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" oninput="changeVolume(this.value)" />
                        <div id="volume-bar" class="h-full bg-white rounded-full pointer-events-none group-hover:bg-indigo-400 transition-colors" style="width: 50%"></div>
                    </div>
                </div>
                <button onclick="togglePlaylist()" id="playlist-toggle-btn" class="p-2 rounded-lg transition-colors bg-white/20 text-white">
                    <span class="material-symbols-rounded">queue_music</span>
                </button>
            </div>
            
        </div>
    </div>

                    { id: 34, title: 'Synth Wave One', artist: 'Instrumental', url: './music/morning-4.mp3', cover: 'https://picsum.photos/seed/morning4/300/300' },
                    { id: 35, title: 'Synth Wave Two', artist: 'Instrumental', url: './music/morning-5.mp3', cover: 'https://picsum.photos/seed/morning5/300/300' },

                    { id: 37, title: 'Synth Wave Four', artist: 'Instrumental', url: './music/morning-7.mp3', cover: 'https://picsum.photos/seed/morning7/300/300' },
                    { id: 38, title: 'Tech Pulse', artist: 'Instrumental', url: './music/morning-8.mp3', cover: 'https://picsum.photos/seed/morning8/300/300' },
                    { id: 39, title: 'Theme Awakening', artist: 'Instrumental', url: './music/morning-9.mp3', cover: 'https://picsum.photos/seed/morning9/300/300' },
                    { id: 40, title: 'Golden Highscore', artist: 'Instrumental', url: './music/morning-10.mp3', cover: 'https://picsum.photos/seed/morning10/300/300' }
                ]
            }
        ];

        // --- STATE ---
        let currentStationIdx = -1; 
        let currentTrackIdx = 0;
        let isPlaying = false;
        let volume = 0.5;
        let showPlaylist = true;
        let zenModeActive = false;
        let usingFallback = false;
        let consecutiveErrors = 0;

        // Pomodoro State
        let timerInterval;
        let timeLeft = 25 * 60; // 25 mins
        let isTimerRunning = false;
        let timerMode = 'work'; // 'work' or 'break'

        // --- DOM ELEMENTS ---
        let audio, bgVideo, bgImage, bgGradient, stationsContainer, tracksContainer;
        let currentCover, currentCoverContainer, currentTitle, currentArtist;
        let mainPlayIcon, timeCurrent, timeTotal, progressBar, progressContainer;
        let volumeIcon, volumeBar, volumeSlider, playlistContainer, playlistToggleBtn;
        let timerDisplay, timerIcon, btnWork, btnBreak;
        
        let sfx = {};

        // --- INITIALIZATION ---
        function init() {
            audio = document.getElementById('audio-player');
            bgVideo = document.getElementById('bg-video');
            bgImage = document.getElementById('bg-image');
            bgGradient = document.getElementById('bg-gradient');
            stationsContainer = document.getElementById('stations-container');
            tracksContainer = document.getElementById('tracks-container');
            
            currentCover = document.getElementById('current-cover');
            currentCoverContainer = document.getElementById('current-cover-container');
            currentTitle = document.getElementById('current-title');
            currentArtist = document.getElementById('current-artist');
            
            mainPlayIcon = document.getElementById('main-play-icon');
            timeCurrent = document.getElementById('time-current');
            timeTotal = document.getElementById('time-total');
            progressBar = document.getElementById('progress-bar');
            progressContainer = document.getElementById('progress-container');
            
            volumeIcon = document.getElementById('volume-icon');
            volumeBar = document.getElementById('volume-bar');
            volumeSlider = document.getElementById('volume-slider');
            
            playlistContainer = document.getElementById('playlist-container');
            playlistToggleBtn = document.getElementById('playlist-toggle-btn');
            
            timerDisplay = document.getElementById('timer-display');
            timerIcon = document.getElementById('timer-icon');
            btnWork = document.getElementById('btn-work');
            btnBreak = document.getElementById('btn-break');

            sfx = {
                rain: document.getElementById('sfx-rain'),
                fire: document.getElementById('sfx-fire'),
                cafe: document.getElementById('sfx-cafe')
            };

            // Ensure SFX start completely muted to perfectly match the visual sliders
            Object.values(sfx).forEach(sound => {
                sound.volume = 0;
            });

            audio.volume = volume;
            
            // Attach listeners BEFORE loading the station to ensure we catch initial metadata
            setupEventListeners();
            loadStation(0); 
        }

        function setupEventListeners() {
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', updateProgress);
            audio.addEventListener('durationchange', updateProgress);
            
            audio.addEventListener('error', (e) => {
                const track = STATIONS[currentStationIdx].tracks[currentTrackIdx];
                if (!usingFallback && track.fallbackSrc) {
                    usingFallback = true;
                    const wasPlaying = isPlaying;
                    audio.src = track.fallbackSrc;
                    if (wasPlaying) attemptPlay();
                    return; 
                }

                const wasPlayingBeforeError = isPlaying;
                isPlaying = false;
                updatePlayStateUI();
                consecutiveErrors++;
                
                if (consecutiveErrors <= 3) {
                    setTimeout(() => {
                        if (wasPlayingBeforeError) isPlaying = true;
                        playNext(wasPlayingBeforeError);
                    }, 2000);
                }
            });

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                // Ignore if user is typing in an input
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowRight') {
                    playNext(true);
                } else if (e.code === 'ArrowLeft') {
                    playPrev(true);
                }
            });
        }

        // --- NEW FOCUS FEATURES ---
        
        function toggleSuggestionBox() {
            suggestionModal.classList.toggle('hidden');
        }

        function toggleZenMode() {
            zenModeActive = !zenModeActive;
            const icon = document.getElementById('zen-icon');
            if (zenModeActive) {
                document.body.classList.add('zen-active');
                icon.textContent = 'visibility_off';
            } else {
                document.body.classList.remove('zen-active');
                icon.textContent = 'visibility';
            }
        }

        function changeSfxVolume(type, val) {
            const vol = parseFloat(val);
            sfx[type].volume = vol;
            document.getElementById(`bar-${type}`).style.width = `${vol * 100}%`;
            
            if (vol > 0 && sfx[type].paused) {
                sfx[type].play().catch(e => console.log("Auto-play prevented for SFX until interaction"));
            } else if (vol === 0) {
                sfx[type].pause();
            }
        }

        // --- POMODORO TIMER ---
        
        function formatTimer(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTimer(timeLeft);
        }

        function changeTimerMode(mode) {
            timerMode = mode;
            isTimerRunning = false;
            clearInterval(timerInterval);
            timerIcon.textContent = 'play_circle';
            
            if (mode === 'work') {
                timeLeft = 25 * 60;
                btnWork.className = 'text-xs font-semibold uppercase tracking-wider text-indigo-300 transition-colors';
                btnBreak.className = 'text-xs font-semibold uppercase tracking-wider text-white/50 hover:text-white transition-colors';
            } else {
                timeLeft = 5 * 60;
                btnBreak.className = 'text-xs font-semibold uppercase tracking-wider text-emerald-300 transition-colors';
                btnWork.className = 'text-xs font-semibold uppercase tracking-wider text-white/50 hover:text-white transition-colors';
            }
            updateTimerDisplay();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                timerIcon.textContent = 'play_circle';
            } else {
                isTimerRunning = true;
                timerIcon.textContent = 'pause_circle';
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        timerIcon.textContent = 'play_circle';
                        // Play a gentle notification chime
                        const chime = new Audio('https://cdn.freesound.org/previews/411/411088_5121236-hq.mp3');
                        chime.volume = 0.5;
                        chime.play();
                    }
                }, 1000);
            }
        }


        // --- CORE MUSIC FUNCTIONS ---

        function attemptPlay() {
            if (!audio.src) return;
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    consecutiveErrors = 0; 
                    updatePlayStateUI();
                    
                    // Make sure SFX are playing if volume > 0
                    Object.keys(sfx).forEach(key => {
                        if (sfx[key].volume > 0 && sfx[key].paused) sfx[key].play();
                    });

                }).catch(error => {
                    if (error.name === 'AbortError') return;
                    isPlaying = false;
                    updatePlayStateUI();
                });
            }
        }

        function loadStation(idx) {
            const isNewStation = currentStationIdx !== idx;
            currentStationIdx = idx;
            const station = STATIONS[idx];
            
            if (station.bg.match(/\.(mp4|webm)$/i)) {
                bgVideo.src = station.bg;
                bgVideo.onloadeddata = () => { bgVideo.classList.remove('opacity-0'); bgImage.classList.add('opacity-0'); };
                bgVideo.onerror = () => { bgVideo.classList.add('opacity-0'); bgImage.classList.remove('opacity-0'); bgImage.style.backgroundImage = `url(${station.fallbackBg})`; };
            } else {
                const bgImg = new Image();
                bgImg.onload = () => { bgImage.style.backgroundImage = `url(${station.bg})`; bgImage.classList.remove('opacity-0'); bgVideo.classList.add('opacity-0'); };
                bgImg.onerror = () => { bgImage.classList.remove('opacity-0'); bgVideo.classList.add('opacity-0'); bgImage.style.backgroundImage = `url(${station.fallbackBg})`; };
                bgImg.src = station.bg;
            }
            
            bgGradient.className = `absolute inset-0 z-0 opacity-80 mix-blend-multiply transition-all duration-1000 ${station.color}`;
            
            if (isNewStation) {
                loadTrack(0); 
            } else {
                renderStations(); 
            }
        }

        function loadTrack(idx) {
            currentTrackIdx = idx;
            const currentStationTracks = STATIONS[currentStationIdx].tracks;
            const track = currentStationTracks[idx];
            
            usingFallback = false;
            track.fallbackSrc = fallbackMusic[idx % fallbackMusic.length];
            
            audio.src = track.url;
            currentCover.src = track.cover;
            currentTitle.textContent = track.title;
            currentArtist.textContent = track.artist;
            
            if (isPlaying) { attemptPlay(); }
            renderStations(); 
            renderPlaylist(); 

            setTimeout(() => {
                const activeTrackEl = document.getElementById('active-track');
                if (activeTrackEl) { activeTrackEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
            }, 50);
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                // Pause ambient sounds too
                Object.values(sfx).forEach(sound => sound.pause());
                isPlaying = false;
                updatePlayStateUI();
            } else {
                attemptPlay();
            }
        }

        function playNext(userInitiated = false) {
            const currentStationTracks = STATIONS[currentStationIdx].tracks;
            let nextIdx = (currentTrackIdx + 1) % currentStationTracks.length;
            if (userInitiated) { isPlaying = true; }
            loadTrack(nextIdx);
        }

        function playPrev(userInitiated = false) {
            const currentStationTracks = STATIONS[currentStationIdx].tracks;
            let prevIdx = (currentTrackIdx - 1 + currentStationTracks.length) % currentStationTracks.length;
            if (userInitiated) { isPlaying = true; }
            loadTrack(prevIdx);
        }

        function playTrackFromPlaylist(idx, userInitiated = false) {
            if (userInitiated) { isPlaying = true; }
            loadTrack(idx);
        }

        // --- UI UPDATES & RENDERERS ---
        function updatePlayStateUI() {
            mainPlayIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
            isPlaying ? currentCoverContainer.classList.add('spin-slow') : currentCoverContainer.classList.remove('spin-slow');
            renderStations(); 
            renderPlaylist(); 
        }

        function updateProgress() {
            const current = audio.currentTime || 0;
            const total = audio.duration || 0;
            
            timeCurrent.textContent = formatTime(current);
            timeTotal.textContent = formatTime(total);
            
            // isFinite check prevents the bar from breaking if the browser reports Infinity duration
            const percent = (total > 0 && isFinite(total)) ? (current / total) * 100 : 0;
            progressBar.style.width = `${percent}%`;
        }

        function seekTrack(e) {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * (audio.duration || 0);
        }

        function changeVolume(val) {
            volume = parseFloat(val);
            audio.volume = volume;
            volumeBar.style.width = `${volume * 100}%`;
            if (volume === 0) { volumeIcon.textContent = 'volume_off'; } 
            else if (volume < 0.5) { volumeIcon.textContent = 'volume_down'; } 
            else { volumeIcon.textContent = 'volume_up'; }
        }

        function toggleMute() {
            if (volume > 0) { volumeSlider.value = 0; changeVolume(0); } 
            else { volumeSlider.value = 0.5; changeVolume(0.5); }
        }

        function togglePlaylist() {
            showPlaylist = !showPlaylist;
            if (showPlaylist) {
                playlistContainer.classList.remove('translate-x-full', 'hidden');
                playlistToggleBtn.classList.replace('text-white/60', 'text-white');
                playlistToggleBtn.classList.replace('hover:bg-white/10', 'bg-white/20');
            } else {
                playlistContainer.classList.add('translate-x-full', 'hidden');
                playlistToggleBtn.classList.replace('text-white', 'text-white/60');
                playlistToggleBtn.classList.replace('bg-white/20', 'hover:bg-white/10');
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } 
            else { document.exitFullscreen(); }
        }

        function renderStations() {
            stationsContainer.innerHTML = STATIONS.map((station, idx) => {
                const isActive = currentStationIdx === idx;
                let eqHtml = '';
                if (isActive && isPlaying) {
                    eqHtml = `
                        <div class="flex items-end gap-1 ml-auto h-4">
                            <div class="w-1 bg-white/80 rounded-t-sm eq-bar"></div>
                            <div class="w-1 bg-white/80 rounded-t-sm eq-bar"></div>
                            <div class="w-1 bg-white/80 rounded-t-sm eq-bar"></div>
                        </div>
                    `;
                }
                return `
                    <button onclick="loadStation(${idx})" class="flex items-center gap-4 px-4 py-3 rounded-xl transition-all duration-300 backdrop-blur-md border ${isActive ? 'bg-white/20 border-white/30 text-white shadow-lg' : 'bg-white/5 border-transparent text-white/60 hover:bg-white/10 hover:text-white'}">
                        <span class="material-symbols-rounded" style="font-size: 20px;">${station.icon}</span>
                        <span class="font-medium text-sm">${station.name}</span>
                        ${eqHtml}
                    </button>
                `;
            }).join('');
        }

        function renderPlaylist() {
            const currentStationTracks = STATIONS[currentStationIdx].tracks;
            tracksContainer.innerHTML = currentStationTracks.map((track, idx) => {
                const isActive = currentTrackIdx === idx;
                let overlayIcon = isActive ? `<div class="absolute inset-0 flex items-center justify-center bg-black/40"><span class="material-symbols-rounded fill text-white" style="font-size: 20px;">${isPlaying ? 'pause' : 'play_arrow'}</span></div>` : '';
                return `
                    <div ${isActive ? 'id="active-track"' : ''} onclick="playTrackFromPlaylist(${idx}, true)" class="flex items-center gap-3 p-2 rounded-lg cursor-pointer transition-all duration-200 group ${isActive ? 'bg-white/10' : 'hover:bg-white/5'}">
                        <div class="relative w-12 h-12 overflow-hidden rounded-md shadow-sm shrink-0">
                            <img src="${track.cover}" alt="${track.title}" class="object-cover w-full h-full" />
                            ${overlayIcon}
                        </div>
                        <div class="flex flex-col overflow-hidden">
                            <span class="text-sm font-medium truncate ${isActive ? 'text-white' : 'text-white/80 group-hover:text-white'}">${track.title}</span>
                            <span class="text-xs text-white/50 truncate">${track.artist}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- UTILS ---
        function formatTime(seconds) {
            // Protects against missing audio metadata causing "Infinity:NaN" to appear
            if (seconds === undefined || isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
