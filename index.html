<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chillwave - Lo-Fi Player</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />

    <style>
        /* Custom styles for Material Symbols and specific animations */
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-rounded.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .scrollbar-thin::-webkit-scrollbar {
            width: 4px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }

        .spin-slow {
            animation: spin 20s linear infinite;
        }

        @keyframes bounce-eq {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .eq-bar {
            animation: bounce-eq 1s ease-in-out infinite;
        }
        .eq-bar:nth-child(1) { animation-delay: 0ms; }
        .eq-bar:nth-child(2) { animation-delay: 150ms; }
        .eq-bar:nth-child(3) { animation-delay: 300ms; }
    </style>
</head>
<body class="relative w-full h-screen overflow-hidden font-sans text-white bg-gray-900 select-none">

    <div id="toast" class="fixed top-4 right-4 max-w-sm bg-indigo-600/90 backdrop-blur-md text-white px-4 py-3 rounded-lg shadow-2xl transform transition-all duration-300 translate-x-[150%] opacity-0 z-50 flex items-start gap-3 border border-indigo-400/50">
        <span id="toast-icon" class="material-symbols-rounded mt-0.5">info</span>
        <div class="flex flex-col">
            <span id="toast-title" class="font-bold text-sm">Notification</span>
            <span id="toast-message" class="text-xs text-white/90 leading-tight mt-1">Message goes here.</span>
        </div>
    </div>

    <div id="suggestion-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="bg-gray-800/90 p-8 rounded-2xl w-full max-w-md border border-white/10 shadow-2xl relative">
            <button onclick="toggleSuggestionBox()" class="absolute top-4 right-4 text-white/50 hover:text-white transition-colors">
                <span class="material-symbols-rounded">close</span>
            </button>
            <h2 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
                <span class="material-symbols-rounded text-indigo-400">lightbulb</span>
                Suggest a Song
            </h2>
            <p class="text-xs text-white/50 mb-6">Know a great instrumental track? Send it over and it might be added to the playlists!</p>
            
            <form id="suggestion-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs text-white/60 mb-1 ml-1 uppercase tracking-wider">Song Title *</label>
                    <input type="text" name="Song Title" required class="w-full bg-black/20 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white placeholder:text-white/30 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="e.g. Midnight Coffee" />
                </div>
                <div>
                    <label class="block text-xs text-white/60 mb-1 ml-1 uppercase tracking-wider">Artist *</label>
                    <input type="text" name="Artist" required class="w-full bg-black/20 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white placeholder:text-white/30 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="e.g. Lofi Maker" />
                </div>
                <div>
                    <label class="block text-xs text-white/60 mb-1 ml-1 uppercase tracking-wider">Link (Optional)</label>
                    <input type="url" name="Link" class="w-full bg-black/20 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white placeholder:text-white/30 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="YouTube or Spotify link" />
                </div>
                <button type="submit" id="submit-btn" class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition-colors flex justify-center items-center gap-2">
                    <span class="material-symbols-rounded" style="font-size: 20px;">send</span>
                    Send Suggestion
                </button>
            </form>
        </div>
    </div>

    <!-- Added HTML Video Element for MP4 Backgrounds -->
    <video id="bg-video" class="absolute inset-0 z-0 w-full h-full object-cover transition-opacity duration-1000 opacity-0" autoplay loop muted playsinline></video>
    <div id="bg-image" class="absolute inset-0 z-0 transition-opacity duration-1000 ease-in-out bg-center bg-cover"></div>
    <div id="bg-gradient" class="absolute inset-0 z-0 opacity-80 mix-blend-multiply transition-all duration-1000"></div>
    <div class="absolute inset-0 z-0 bg-black/20"></div>

    <audio id="audio-player"></audio>
    
    <!-- Ambient SFX Audio -->
    <audio id="sfx-rain" loop src="./assets/rain.mp3"></audio>
    <audio id="sfx-fire" loop src="./assets/fire.mp3"></audio>
    <audio id="sfx-cafe" loop src="./assets/cafe.mp3"></audio>

    <div class="relative z-10 flex flex-col h-full">

                </div>
                <h1 class="text-xl font-bold tracking-wider text-white drop-shadow-md">
                    CHILL<span class="font-light text-white/70">WAVE</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="toggleSuggestionBox()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium transition-colors border rounded-full bg-white/10 hover:bg-white/20 border-white/20 text-white/90 hover:text-white" title="Suggest a song">
                    <span class="material-symbols-rounded" style="font-size: 18px;">lightbulb</span>
                    Suggest Song

                <button onclick="toggleFullscreen()" class="p-2 transition-colors rounded-full hover:bg-white/10 text-white/80 hover:text-white" title="Fullscreen">
                    <span class="material-symbols-rounded">fullscreen</span>
                </button>
            </div>
        </header>

        <div class="flex flex-1 overflow-hidden">
            
            <div class="flex flex-col gap-2 p-6 w-72">

                <div id="stations-container" class="flex flex-col gap-2">
                    </div>
                
                <!-- Ambient Mixer -->
                <h2 class="mt-8 mb-4 text-xs font-semibold tracking-widest uppercase text-white/50 flex items-center gap-2">
                    <span class="material-symbols-rounded" style="font-size: 16px;">tune</span> Ambient Mixer
                </h2>
                <div class="flex flex-col gap-4 bg-black/20 p-4 rounded-xl border border-white/5 backdrop-blur-md">
                    <!-- Rain Slider -->
                    <div class="flex items-center gap-3 group">
                        <span class="material-symbols-rounded text-white/50 group-hover:text-blue-300 transition-colors" style="font-size: 20px;">water_drop</span>
                        <div class="flex-1 h-1.5 bg-white/10 rounded-full cursor-pointer relative flex items-center">
                            <input type="range" min="0" max="1" step="0.01" value="0" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" oninput="changeSfxVolume('rain', this.value)" />
                            <div id="bar-rain" class="h-full bg-blue-400 rounded-full pointer-events-none transition-all" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Fire Slider -->
                    <div class="flex items-center gap-3 group">
                        <span class="material-symbols-rounded text-white/50 group-hover:text-orange-400 transition-colors" style="font-size: 20px;">local_fire_department</span>

                            <input type="range" min="0" max="1" step="0.01" value="0" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" oninput="changeSfxVolume('fire', this.value)" />
                            <div id="bar-fire" class="h-full bg-orange-400 rounded-full pointer-events-none transition-all" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Cafe Slider -->

                        <div class="flex-1 h-1.5 bg-white/10 rounded-full cursor-pointer relative flex items-center">
                            <input type="range" min="0" max="1" step="0.01" value="0" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" oninput="changeSfxVolume('cafe', this.value)" />

                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1"></div>

                 <div id="tracks-container" class="flex flex-col gap-3 overflow-y-auto pr-2 pb-4 scrollbar-thin">
                     </div>
            </div>
        </div>

        <!-- Removed 'absolute bottom-0' and added 'relative shrink-0' so it pushes the playlist up -->
        <div class="relative shrink-0 w-full h-24 bg-black/40 backdrop-blur-2xl border-t border-white/10 flex items-center justify-between px-8 z-20">
            
            <div class="flex items-center gap-4 w-1/4 min-w-[200px]">
                <div id="current-cover-container" class="relative w-14 h-14 overflow-hidden rounded-lg shadow-lg">
                     <img id="current-cover" src="" alt="Cover" class="object-cover w-full h-full" />
                     <div class="absolute inset-0 m-auto w-3 h-3 bg-black/80 rounded-full border border-white/20"></div>
                </div>
                <div class="flex flex-col">
                    <span id="current-title" class="text-sm font-semibold text-white truncate"></span>
                    <span id="current-artist" class="text-xs text-white/60 truncate"></span>
                </div>
            </div>

            <div class="flex flex-col items-center justify-center flex-1 max-w-2xl px-8 gap-2">
                <div class="flex items-center gap-6">
                    <button onclick="playPrev(true)" class="text-white/60 hover:text-white transition-colors">
                        <span class="material-symbols-rounded fill">skip_previous</span>
                    </button>
                    
                    <button onclick="togglePlay()" class="flex items-center justify-center w-12 h-12 rounded-full bg-white text-black hover:scale-105 transition-transform shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                        <span id="main-play-icon" class="material-symbols-rounded fill">play_arrow</span>
                    </button>
                    
                    <button onclick="playNext(true)" class="text-white/60 hover:text-white transition-colors">
                        <span class="material-symbols-rounded fill">skip_next</span>
                    </button>
                </div>

                <div class="flex items-center w-full gap-3 text-xs text-white/50 font-medium">
                    <span id="time-current">0:00</span>
                    <div id="progress-container" class="relative flex-1 h-1.5 bg-white/20 rounded-full cursor-pointer group" onclick="seekTrack(event)">
                        <div id="progress-bar" class="absolute top-0 left-0 h-full bg-white rounded-full transition-all duration-75 group-hover:bg-indigo-400" style="width: 0%">
                            <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        </div>
                    </div>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="flex items-center justify-end gap-6 w-1/4 min-w-[200px]">
                <div class="flex items-center gap-2 group">
                    <button onclick="toggleMute()" class="text-white/60 hover:text-white transition-colors">
                        <span id="volume-icon" class="material-symbols-rounded">volume_up</span>
                    </button>
                    <div class="w-24 h-1.5 bg-white/20 rounded-full cursor-pointer relative flex items-center">
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" oninput="changeVolume(this.value)" />
                        <div id="volume-bar" class="h-full bg-white rounded-full pointer-events-none group-hover:bg-indigo-400 transition-colors" style="width: 50%"></div>
                    </div>
                </div>

                <button onclick="togglePlaylist()" id="playlist-toggle-btn" class="p-2 rounded-lg transition-colors bg-white/20 text-white">
                    <span class="material-symbols-rounded">queue_music</span>
                </button>
            </div>
            
        </div>
    </div>

        // --- STATE ---
        let currentStationIdx = -1; 
        let currentTrackIdx = 0;
        let isPlaying = false;
        let volume = 0.5;
        let showPlaylist = true;
        let toastTimeout;
        let usingFallback = false;

        // --- DOM ELEMENTS ---

        let currentCover, currentCoverContainer, currentTitle, currentArtist;
        let mainPlayIcon, timeCurrent, timeTotal, progressBar, progressContainer;
        let volumeIcon, volumeBar, volumeSlider, playlistContainer, playlistToggleBtn;
        let suggestionModal, suggestionForm;
        let sfx = {};

        // --- INITIALIZATION ---
        function init() {
            audio = document.getElementById('audio-player');
            bgVideo = document.getElementById('bg-video');
            bgImage = document.getElementById('bg-image');
            bgGradient = document.getElementById('bg-gradient');
            stationsContainer = document.getElementById('stations-container');

            currentCover = document.getElementById('current-cover');

            currentTitle = document.getElementById('current-title');

            mainPlayIcon = document.getElementById('main-play-icon');
            timeCurrent = document.getElementById('time-current');
            timeTotal = document.getElementById('time-total');
            progressBar = document.getElementById('progress-bar');
            progressContainer = document.getElementById('progress-container');
            
            volumeIcon = document.getElementById('volume-icon');
            volumeBar = document.getElementById('volume-bar');
            volumeSlider = document.getElementById('volume-slider');
            
            playlistContainer = document.getElementById('playlist-container');
            playlistToggleBtn = document.getElementById('playlist-toggle-btn');
            
            suggestionModal = document.getElementById('suggestion-modal');
            suggestionForm = document.getElementById('suggestion-form');

            // Map the audio elements safely
            sfx = {
                rain: document.getElementById('sfx-rain'),
                fire: document.getElementById('sfx-fire'),
                cafe: document.getElementById('sfx-cafe')
            };

            // Ensure SFX start completely muted to perfectly match the visual sliders
            Object.values(sfx).forEach(sound => {
                if (sound) sound.volume = 0;
            });

            audio.volume = volume;
            
            // Setup UI immediately
            loadStation(0); 
            
            // Audio Event Listeners
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', updateProgress);
            audio.addEventListener('ended', () => playNext(true));
            
            audio.addEventListener('error', (e) => {
                const track = STATIONS[currentStationIdx].tracks[currentTrackIdx];
                
                // If local file is missing, fallback to a working preview track.
                if (!usingFallback && track.fallbackSrc) {
                    usingFallback = true;
                    const wasPlaying = isPlaying;
                    audio.src = track.fallbackSrc;
                    if (wasPlaying) attemptPlay();
                    return; 
                }

                // If even the fallback fails, handle the error safely
                const wasPlayingBeforeError = isPlaying;
                isPlaying = false;
                updatePlayStateUI();
                consecutiveErrors++;
                
                const fileName = track.title || "Audio file";
                
                // Limit skipping to prevent infinite loops if multiple files are missing
                if (consecutiveErrors <= 3) {
                    showToast("Missing File", `Could not play ${fileName}. Skipping...`, "error");
                    setTimeout(() => {
                        // If it was playing before it errored out, keep the momentum going
                        if (wasPlayingBeforeError) isPlaying = true;
                        playNext(wasPlayingBeforeError);
                    }, 2000);
                } else {
                    showToast("Playback Paused", "Multiple files missing. Please check your GitHub uploads.", "error");
                }
            });

            // Form Submit Listener (AJAX)
            suggestionForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // IMPORTANT: Replace the URL below with your actual Formspree endpoint URL!
                const formspreeEndpoint = 'https://formspree.io/f/YOUR_UNIQUE_FORM_ID'; 
                
                const submitBtn = document.getElementById('submit-btn');
                const originalBtnText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span class="material-symbols-rounded animate-spin">sync</span> Sending...';
                submitBtn.disabled = true;

                try {
                    const formData = new FormData(suggestionForm);
                    const response = await fetch(formspreeEndpoint, {
                        method: 'POST',
                        body: formData,
                        headers: { 'Accept': 'application/json' }
                    });
                    
                    if (response.ok) {
                        showToast("Success", "Your song suggestion was sent!", "check_circle");
                        suggestionForm.reset();
                        toggleSuggestionBox();
                    } else {
                        showToast("Error", "Oops! Ensure you replaced the Formspree URL in the code.", "error");
                    }
                } catch (error) {
                    showToast("Error", "There was a problem sending your suggestion.", "error");
                } finally {
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                }
            });
        }

        // --- CORE FUNCTIONS ---
        function toggleSuggestionBox() {
            suggestionModal.classList.toggle('hidden');
        }

        function showToast(title, message, icon = "info") {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');
            
            toastTitle.textContent = title;
            toastMessage.textContent = message;
            toastIcon.textContent = icon;
            
            // Swap colors based on error vs success
            if (icon === 'error') {
                toast.classList.replace('bg-indigo-600/90', 'bg-red-600/90');
                toast.classList.replace('border-indigo-400/50', 'border-red-400/50');
            } else {
                toast.classList.replace('bg-red-600/90', 'bg-indigo-600/90');
                toast.classList.replace('border-red-400/50', 'border-indigo-400/50');
            }
            
            clearTimeout(toastTimeout);
            toast.classList.remove('translate-x-[150%]', 'opacity-0');
            
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-x-[150%]', 'opacity-0');
            }, 5000);
        }

        function attemptPlay() {
            if (!audio.src) return;
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    consecutiveErrors = 0; // Reset error counter on successful playback
                    updatePlayStateUI();
                    
                    // Make sure SFX are playing if volume > 0, with a safety null check
                    Object.keys(sfx).forEach(key => {
                        if (sfx[key] && sfx[key].volume > 0 && sfx[key].paused) {
                            sfx[key].play().catch(e => console.warn("SFX play prevented", e));
                        }
                    });
                }).catch(error => {
                    // Ignore DOM AbortErrors gracefully (happens during rapid track skipping)
                    if (error.name === 'AbortError') return;
                    
                    isPlaying = false;
                    updatePlayStateUI();
                    
                    if(error.name === 'NotAllowedError') {
                        showToast("Notice", "Please click the Play button to start the music.", "info");
                    }
                });
            }
        }

        function loadStation(idx) {
            const isNewStation = currentStationIdx !== idx;
            currentStationIdx = idx;
            const station = STATIONS[idx];
            
            // Background Logic: Dynamically handle MP4 Videos or GIF/JPG Images
            if (station.bg.match(/\.(mp4|webm)$/i)) {
                bgVideo.src = station.bg;
                bgVideo.onloadeddata = () => {
                    bgVideo.classList.remove('opacity-0');
                    bgImage.classList.add('opacity-0');
                };
                bgVideo.onerror = () => {
                    console.warn(`Local video ${station.bg} not found. Falling back to preview GIF.`);
                    bgVideo.classList.add('opacity-0');
                    bgImage.classList.remove('opacity-0');
                    bgImage.style.backgroundImage = `url(${station.fallbackBg})`;
                };
            } else {
                const bgImg = new Image();
                bgImg.onload = () => {
                    bgImage.style.backgroundImage = `url(${station.bg})`;
                    bgImage.classList.remove('opacity-0');
                    bgVideo.classList.add('opacity-0');
                };
                bgImg.onerror = () => {
                    console.warn(`Local background ${station.bg} not found. Falling back to preview GIF.`);
                    bgImage.classList.remove('opacity-0');
                    bgVideo.classList.add('opacity-0');
                    bgImage.style.backgroundImage = `url(${station.fallbackBg})`;
                };
                bgImg.src = station.bg;
            }
            
            bgGradient.className = `absolute inset-0 z-0 opacity-80 mix-blend-multiply transition-all duration-1000 ${station.color}`;
            
            if (isNewStation) {
                loadTrack(0); 
            } else {
                renderStations(); 
            }
        }

        function loadTrack(idx) {
            currentTrackIdx = idx;
            const currentStationTracks = STATIONS[currentStationIdx].tracks;
            const track = currentStationTracks[idx];
            
            usingFallback = false;
            
            track.fallbackSrc = fallbackMusic[idx % fallbackMusic.length];
            
            audio.src = track.url;
            currentCover.src = track.cover;
            currentTitle.textContent = track.title;
            currentArtist.textContent = track.artist;
            
            if (isPlaying) {
                attemptPlay();
            }
            renderStations(); 
            renderPlaylist(); 

            // Automatically scroll the playlist to show the newly loaded track
            setTimeout(() => {
                const activeTrackEl = document.getElementById('active-track');
                if (activeTrackEl) {
                    activeTrackEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 50);
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                Object.values(sfx).forEach(sound => { if (sound) sound.pause(); });
                isPlaying = false;
                updatePlayStateUI();
            } else {
                attemptPlay();
            }
        }

        function playNext(userInitiated = false) {
            const currentStationTracks = STATIONS[currentStationIdx].tracks;
            let nextIdx = (currentTrackIdx + 1) % currentStationTracks.length;
            
            if (userInitiated) {
                isPlaying = true;
            }
            
            loadTrack(nextIdx);
        }

        function playPrev(userInitiated = false) {
            const currentStationTracks = STATIONS[currentStationIdx].tracks;
            let prevIdx = (currentTrackIdx - 1 + currentStationTracks.length) % currentStationTracks.length;
            
            if (userInitiated) {
                isPlaying = true;
            }
            
            loadTrack(prevIdx);
        }

        function playTrackFromPlaylist(idx, userInitiated = false) {
            if (userInitiated) {
                isPlaying = true;
            }
            
            loadTrack(idx);
        }

        // --- UI UPDATES ---
        function updatePlayStateUI() {
            mainPlayIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
            
            if (isPlaying) {
                currentCoverContainer.classList.add('spin-slow');
            } else {
                currentCoverContainer.classList.remove('spin-slow');
            }
            
            renderStations(); 
            renderPlaylist(); 
        }

        function updateProgress() {
            const current = audio.currentTime || 0;
            const total = audio.duration || 0;
            
            timeCurrent.textContent = formatTime(current);
            timeTotal.textContent = formatTime(total);
            
            const percent = total > 0 ? (current / total) * 100 : 0;
            progressBar.style.width = `${percent}%`;
        }

        function seekTrack(e) {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * (audio.duration || 0);
        }

        function changeVolume(val) {
            volume = parseFloat(val);
            audio.volume = volume;
            volumeBar.style.width = `${volume * 100}%`;
            
            if (volume === 0) {
                volumeIcon.textContent = 'volume_off';
            } else if (volume < 0.5) {
                volumeIcon.textContent = 'volume_down';
            } else {
                volumeIcon.textContent = 'volume_up';
            }
        }

        function changeSfxVolume(type, val) {
            if (!sfx[type]) return; // Safeguard
            const vol = parseFloat(val);
            sfx[type].volume = vol;
            document.getElementById(`bar-${type}`).style.width = `${vol * 100}%`;
            
            if (vol > 0 && sfx[type].paused) {
                sfx[type].play().catch(e => console.log("Auto-play prevented for SFX until interaction"));
            } else if (vol === 0) {
                sfx[type].pause();
            }
        }

        function toggleMute() {
            if (volume > 0) {
                volumeSlider.value = 0;
                changeVolume(0);
            } else {
                volumeSlider.value = 0.5;
                changeVolume(0.5);
            }
        }

        function togglePlaylist() {
            showPlaylist = !showPlaylist;
            if (showPlaylist) {
                playlistContainer.classList.remove('translate-x-full', 'hidden');
                playlistToggleBtn.classList.replace('text-white/60', 'text-white');
                playlistToggleBtn.classList.replace('hover:bg-white/10', 'bg-white/20');
            } else {
                playlistContainer.classList.add('translate-x-full', 'hidden');
                playlistToggleBtn.classList.replace('text-white', 'text-white/60');
                playlistToggleBtn.classList.replace('bg-white/20', 'hover:bg-white/10');
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error enabling full-screen mode: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // --- RENDERERS ---
        function renderStations() {
            stationsContainer.innerHTML = STATIONS.map((station, idx) => {
                const isActive = currentStationIdx === idx;
                
                let eqHtml = '';
                if (isActive && isPlaying) {
                    eqHtml = `
                        <div class="flex items-end gap-1 ml-auto h-4">
                            <div class="w-1 bg-white/80 rounded-t-sm eq-bar"></div>
                            <div class="w-1 bg-white/80 rounded-t-sm eq-bar"></div>
                            <div class="w-1 bg-white/80 rounded-t-sm eq-bar"></div>
                        </div>
                    `;
                }

                return `
                    <button
                        onclick="loadStation(${idx})"
                        class="flex items-center gap-4 px-4 py-3 rounded-xl transition-all duration-300 backdrop-blur-md border ${
                            isActive 
                            ? 'bg-white/20 border-white/30 text-white shadow-lg' 
                            : 'bg-white/5 border-transparent text-white/60 hover:bg-white/10 hover:text-white'
                        }"
                    >
                        <span class="material-symbols-rounded" style="font-size: 20px;">${station.icon}</span>
                        <span class="font-medium text-sm">${station.name}</span>
                        ${eqHtml}
                    </button>
                `;
            }).join('');
        }

        function renderPlaylist() {
            // Get the tracks for the CURRENT station
            const currentStationTracks = STATIONS[currentStationIdx].tracks;
            
            tracksContainer.innerHTML = currentStationTracks.map((track, idx) => {
                const isActive = currentTrackIdx === idx;
                
                let overlayIcon = '';
                if (isActive) {
                    overlayIcon = `
                        <div class="absolute inset-0 flex items-center justify-center bg-black/40">
                            <span class="material-symbols-rounded fill text-white" style="font-size: 20px;">
                                ${isPlaying ? 'pause' : 'play_arrow'}
                            </span>
                        </div>
                    `;
                }

                return `
                    <div 
                        ${isActive ? 'id="active-track"' : ''}
                        onclick="playTrackFromPlaylist(${idx}, true)"
                        class="flex items-center gap-3 p-2 rounded-lg cursor-pointer transition-all duration-200 group ${
                            isActive ? 'bg-white/10' : 'hover:bg-white/5'
                        }"
                    >
                        <div class="relative w-12 h-12 overflow-hidden rounded-md shadow-sm shrink-0">
                            <img src="${track.cover}" alt="${track.title}" class="object-cover w-full h-full" />
                            ${overlayIcon}
                        </div>
                        <div class="flex flex-col overflow-hidden">
                            <span class="text-sm font-medium truncate ${isActive ? 'text-white' : 'text-white/80 group-hover:text-white'}">
                                ${track.title}
                            </span>
                            <span class="text-xs text-white/50 truncate">
                                ${track.artist}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- UTILS ---
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // Start the app safely once everything is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
